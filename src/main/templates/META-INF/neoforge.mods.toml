modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
issueTrackerURL="https://github.com/joenilan/lensbridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
# The game checks this on start and shows "update available" on the Mods button (written by tools/publish_mod.py)
updateJSONURL="https://apps.zombie.digital/downloads/lensbridge/update.json"
displayURL="https://apps.zombie.digital/lensbridge"
displayName="${mod_name}"
authors="DreadedZombie"
description='''
Lensbridge: a local, token-protected MCP/HTTP bridge that lets AI tools and scripts see and drive the Minecraft client -
screenshots of the game view only, input, inspection, a director camera, and promo capture (stills, orbits, camera paths, video).
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
